<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Escape Room: Sistema Linfatico</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#F7F7F9;font-family:'Segoe UI',Inter,Arial,sans-serif}

/* Colores */
:root{--GR:#A3D9A5;--AQ:#BEE7E8;--LV:#EADFF7;--CR:#FFF5E6;--WH:#F7F7F9;--GY:#EDEDED;--CO:#FFB3A7;--FL:#7FD6B8;--RD:#E64A4A}

/* Pantallas */
.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}
.screen>*{pointer-events:auto}

/* ========== AUTH ========== */
#scr-auth{background:linear-gradient(160deg,#F7F7F9 0%,#EADFF7 40%,#BEE7E8 100%);align-items:center;justify-content:center;padding:20px}
.auth-card{background:white;border-radius:24px;padding:32px 24px;width:min(420px,92%);box-shadow:0 8px 40px rgba(0,0,0,0.08);text-align:center}
.auth-card h1{font-size:32px;color:#A3D9A5;letter-spacing:2px}
.auth-card h2{font-size:16px;color:#7FD6B8;font-weight:400;margin-top:2px}
.auth-card .subtitle{font-size:14px;color:#888;margin:12px 0 20px;line-height:1.5}
.auth-card input,.auth-card select{width:100%;padding:14px 16px;border:2px solid #EDEDED;border-radius:12px;font-size:18px;margin-bottom:10px;outline:none;background:#FAFAFA}
.auth-card input:focus,.auth-card select:focus{border-color:#7FD6B8;background:#fff}
.auth-card select{cursor:pointer}
.auth-card button{width:100%;padding:16px;border:none;border-radius:12px;background:#A3D9A5;color:#1a3a1a;font-size:20px;font-weight:700;cursor:pointer;margin-top:4px}
.auth-card button:active{background:#7FD6B8}
.auth-link{font-size:14px;color:#999;margin-top:14px;cursor:pointer}
.auth-link:hover{color:#A3D9A5}

/* ========== GAME ========== */
#scr-game{background:#F7F7F9}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:white;border-bottom:2px solid #EDEDED;min-height:56px;flex-shrink:0}
.topbar .room-name{font-size:16px;font-weight:700;color:#A3D9A5}
.topbar .timer{font-size:20px;font-weight:700;color:#7FD6B8;font-variant-numeric:tabular-nums}
.topbar .hints{font-size:13px;color:#999}

/* Room content */
.room-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 30px;gap:16px;overflow-y:auto}
.room-title{font-size:clamp(22px,5vw,28px);font-weight:700;color:#A3D9A5;text-align:center}
.room-desc{font-size:16px;color:#666;text-align:center;line-height:1.7;max-width:560px}

/* Puzzle card */
.puzzle-card{background:white;border-radius:20px;padding:24px 20px;width:min(540px,95%);box-shadow:0 4px 20px rgba(0,0,0,0.06);border:1px solid #EDEDED}
.puzzle-card h3{font-size:18px;color:#333;margin-bottom:12px;text-align:center}

/* Secuencia */
.seq-list{display:flex;flex-direction:column;gap:8px}
.seq-item{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#F7F7F9;border:2px solid #EDEDED;border-radius:12px;font-size:17px;color:#333;cursor:pointer;transition:all .15s;user-select:none}
.seq-item:active{background:#EADFF7;border-color:#EADFF7}
.seq-item.sel{background:rgba(163,217,165,0.15);border-color:#A3D9A5}
.seq-item .snum{width:32px;height:32px;border-radius:50%;background:#EDEDED;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#888;flex-shrink:0}
.seq-item.sel .snum{background:#A3D9A5;color:#fff}
.seq-item.ok{border-color:#A3D9A5;background:rgba(163,217,165,0.12)}
.seq-item.ok .snum{background:#A3D9A5;color:#fff}
.seq-item.err{border-color:#E64A4A;background:rgba(230,74,74,0.08)}
.seq-item.err .snum{background:#E64A4A;color:#fff}

/* Match */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match-col h4{font-size:13px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
.match-item{padding:14px 12px;background:#F7F7F9;border:2px solid #EDEDED;border-radius:12px;font-size:15px;color:#333;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.match-item:active{background:#EADFF7;border-color:#EADFF7}
.match-item.sel{border-color:#7FD6B8;background:rgba(127,214,184,0.15)}
.match-item.matched{border-color:#A3D9A5;background:rgba(163,217,165,0.12);opacity:.7;pointer-events:none}
.match-item.wrong{border-color:#E64A4A;background:rgba(230,74,74,0.08)}

/* Trivia */
.trivia-q{font-size:18px;color:#333;text-align:center;margin-bottom:16px;line-height:1.5}
.trivia-opts{display:flex;flex-direction:column;gap:8px}
.trivia-opt{padding:14px 18px;background:#F7F7F9;border:2px solid #EDEDED;border-radius:12px;font-size:16px;color:#333;cursor:pointer;text-align:left;transition:all .15s}
.trivia-opt:active{background:rgba(127,214,184,0.12);border-color:#7FD6B8}
.trivia-opt.ok{border-color:#A3D9A5;background:rgba(163,217,165,0.15)}
.trivia-opt.no{border-color:#E64A4A;background:rgba(230,74,74,0.08)}

/* Code */
.code-row{display:flex;gap:10px;justify-content:center;margin:20px 0}
.code-row input{width:56px;height:64px;text-align:center;font-size:28px;font-weight:700;background:#F7F7F9;border:2px solid #EDEDED;border-radius:12px;color:#333;outline:none}
.code-row input:focus{border-color:#7FD6B8;background:#fff}

/* Buttons */
.btn{padding:14px 28px;border:2px solid;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(0.97)}
.btn-go{background:#A3D9A5;color:#1a3a1a;border-color:#A3D9A5}
.btn-go:active{background:#7FD6B8}
.btn-out{background:transparent;color:#7FD6B8;border-color:rgba(127,214,184,0.3)}
.btn-hint{background:transparent;color:#FFB3A7;border-color:rgba(255,179,167,0.3);font-size:14px;padding:10px 18px}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* Hint */
.hint-box{background:rgba(255,179,167,0.08);border:1px solid rgba(255,179,167,0.25);border-radius:12px;padding:14px;font-size:14px;color:#c07060;line-height:1.5;text-align:center}

/* Fact */
.fact-box{background:rgba(163,217,165,0.08);border:1px solid rgba(163,217,165,0.2);border-radius:12px;padding:12px;font-size:13px;color:#5a8a5c;line-height:1.5;text-align:center}

/* ========== COMPLETE ========== */
#scr-done{background:linear-gradient(160deg,#F7F7F9,#EADFF7,#BEE7E8);align-items:center;justify-content:center;padding:20px}
.done-card{background:white;border-radius:24px;padding:32px 24px;width:min(440px,92%);box-shadow:0 8px 40px rgba(0,0,0,0.08);text-align:center}
.done-card h1{font-size:36px;color:#A3D9A5}
.done-card .d-time{font-size:22px;color:#7FD6B8;margin:6px 0}
.done-card .d-score{font-size:16px;color:#A3D9A5;font-weight:600;margin-bottom:16px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:#F7F7F9;border-radius:10px;padding:14px}
.stat-box .sv{font-size:24px;font-weight:700;color:#A3D9A5}
.stat-box .sl{font-size:12px;color:#999;margin-top:2px}
.learn-box{background:rgba(163,217,165,0.06);border:1px solid rgba(163,217,165,0.15);border-radius:12px;padding:14px;font-size:13px;color:#5a8a5c;line-height:1.7;text-align:left;margin-bottom:16px}

/* ========== ANALYTICS ========== */
#scr-anl{background:#F7F7F9;padding:16px;gap:12px}
.anl-card{background:white;border-radius:16px;padding:20px;width:min(95%,600px);box-shadow:0 4px 20px rgba(0,0,0,0.06)}
.anl-card h2{font-size:22px;color:#A3D9A5;margin-bottom:14px}
.anl-card table{width:100%;border-collapse:collapse;font-size:13px}
.anl-card th{background:#F7F7F9;padding:10px;text-align:left;border-bottom:2px solid #EDEDED;color:#888}
.anl-card td{padding:10px;border-bottom:1px solid #EDEDED;color:#444}
.anl-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.anl-sc{background:#F7F7F9;border-radius:10px;padding:14px;text-align:center}
.anl-sc .v{font-size:26px;font-weight:700;color:#A3D9A5}
.anl-sc .l{font-size:12px;color:#999;margin-top:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shk{animation:shake .3s}
</style>
</head>
<body>

<!-- AUTH -->
<div id="scr-auth" class="screen active">
<div class="auth-card anim">
<h1>ESCAPE ROOM</h1>
<h2>Sistema Linfatico</h2>
<p class="subtitle">Fuiste miniaturizado/a dentro del sistema linfatico. Resuelve 5 retos para escapar.</p>
<input id="au" placeholder="Tu nombre" autocomplete="off" inputmode="text">
<input id="ap" type="password" placeholder="Contrasena" inputmode="text">
<select id="ar"><option value="student">Estudiante</option><option value="teacher">Docente</option></select>
<button onclick="goAuth()">Comenzar</button>
<div class="auth-link" onclick="document.getElementById('ri').style.display=document.getElementById('ri').style.display==='none'?'block':'none'">Como funciona?</div>
<div id="ri" style="display:none;margin-top:10px;padding:12px;background:#F7F7F9;border-radius:10px;font-size:13px;color:#888;line-height:1.6">
Resuelve 5 puzzles sobre el sistema linfatico.<br>
Cada sala tiene 3 pistas disponibles.<br>
Docente: selecciona "Docente" para ver estadisticas.
</div>
</div>
</div>

<!-- GAME -->
<div id="scr-game" class="screen">
<div class="topbar">
<span class="room-name" id="g-name">Sala 1</span>
<span class="timer" id="g-timer">00:00</span>
<span class="hints" id="g-hints">3 pistas</span>
</div>
<div class="room-wrap" id="g-content"></div>
</div>

<!-- DONE -->
<div id="scr-done" class="screen">
<div class="done-card anim" id="done-box"></div>
</div>

<!-- ANALYTICS -->
<div id="scr-anl" class="screen">
<div class="anl-card anim" id="anl-box"></div>
</div>

<script>
/* ============================================================
   LINFOVIA - Escape Room: Sistema Linfatico
   ============================================================ */

/* --- AUDIO --- */
var actx=null;
function ea(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function tn(f,d,t,v){ea();try{var o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sndOk(){tn(523,.12);setTimeout(function(){tn(659,.12)},100);setTimeout(function(){tn(784,.2)},200)}
function sndNo(){tn(200,.25,'square',.06)}
function sndClick(){tn(600,.05)}
function sndWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tn(f,.25,'sine',.08)},i*130)})}

/* --- STORAGE --- */
function gU(){try{return JSON.parse(localStorage.getItem('er_u'))||{}}catch(e){return{}}}
function sU(d){localStorage.setItem('er_u',JSON.stringify(d))}
function gD(){try{return JSON.parse(localStorage.getItem('er_d'))||{a:{},s:[]}}catch(e){return{a:{},s:[]}}}
function sD(d){localStorage.setItem('er_d',JSON.stringify(d))}

/* --- ROOMS --- */
var ROOMS=[
  {
    name:"Sala 1: El Capilar Perdido",
    desc:"Despiertas dentro de un capilar linfatico. Para avanzar, debes poner en orden correcto el recorrido de la linfa, desde los tejidos hasta la sangre.",
    type:"order",
    items:[
      "Capilares linfaticos",
      "Vasos colectores",
      "Ganglios linfaticos",
      "Troncos linfaticos",
      "Conducto toracico",
      "Vena subclavia"
    ],
    answers:[0,1,2,3,4,5],
    hints:[
      "Empieza por lo mas pequeno: los capilares recogen liquido de los tejidos",
      "Despues viene algo mas grande: los vasos colectores",
      "El destino final es una vena cerca de la clavícula (subclavia)"
    ],
    fact:"La linfa recorre: capilares -> vasos colectores -> ganglios -> troncos -> conducto toracico -> vena subclavia."
  },
  {
    name:"Sala 2: La Valvula Secreta",
    desc:"Una valvula bloqueada te impide pasar. Ordena los pasos que permiten a la linfa avanzar gracias a las contracciones musculares.",
    type:"order",
    items:[
      "Musculo se contrae",
      "Vaso linfatico se comprime",
      "Valvula distal (adelante) se abre",
      "Linfa fluye hacia adelante",
      "Valvula proximal (atras) se cierra",
      "Musculo se relaja"
    ],
    answers:[0,1,2,3,4,5],
    hints:[
      "Todo empieza cuando un musculo se contrae",
      "La contraccion comprime el vaso y abre la valvula de adelante",
      "Al relajarse, la valvula de atras se cierra para evitar reflujo"
    ],
    fact:"Las valvulas semilunares permiten flujo unidireccional: abren adelante, cierran atras."
  },
  {
    name:"Sala 3: El Ganglio",
    desc:"Entras a un ganglio linfatico. Para cruzarlo, empareja cada celula inmune con su funcion correcta.",
    type:"match",
    left:["Linfocito B","Linfocito T citotoxico","Celula dendritica","Macrofago"],
    right:["Fagocita patogenos","Produce anticuerpos","Presenta antigenos","Destruye celulas infectadas"],
    pairs:[1,3,2,0],
    hints:[
      "Los linfocitos B producen anticuerpos (forma de Y)",
      "Los T citotoxicos destruyen celulas infectadas",
      "Las celulas dendriticas presentan antigenos a los linfocitos"
    ],
    fact:"B=anticuerpos, T-citotoxico=destruccion, dendritica=presentacion, macrofago=fagocitosis."
  },
  {
    name:"Sala 4: El Codigo Inmune",
    desc:"Un panel de seguridad te pide un codigo. Responde 4 preguntas correctamente para obtener cada digito.",
    type:"trivia",
    qs:[
      {q:"Que liquido circula por los vasos linfaticos?",opts:["Sangre","Linfa","Plasma","Bilis"],ans:1,dig:"3"},
      {q:"Donde maduran los linfocitos T?",opts:["Bazo","Medula osea","Timo","Amigdalas"],ans:2,dig:"7"},
      {q:"Que organo filtra la sangre?",opts:["Ganglio","Timo","Amigdala","Bazo"],ans:3,dig:"1"},
      {q:"Cuantos conductos linfaticos principales existen?",opts:["1","2","3","4"],ans:1,dig:"5"}
    ],
    hints:[
      "No es sangre, tiene otro nombre parecido",
      "Maduran en un organo con nombre de mariposa",
      "Filtra sangre, no linfa. Esta en el lado izquierdo del abdomen",
      "Uno drena 3/4 del cuerpo (toracico), el otro 1/4 (derecho)"
    ],
    fact:"El codigo de escape se forma con los digitos obtenidos de cada respuesta correcta."
  },
  {
    name:"Sala 5: La Salida",
    desc:"Llegaste a la salida. Introduce el codigo de 4 digitos que obtuviste de las respuestas de la Sala 4 para escapar del sistema linfatico.",
    type:"code",
    code:"3715",
    hints:[
      "Recuerda: Linfa=3, Timo=7, Bazo=1, Dos conductos=5",
      "El codigo es: 3-7-1-5",
      "Escribe 3715 en los 4 campos"
    ],
    fact:"El conducto toracico drena 3/4 del cuerpo. El conducto linfatico derecho drena el cuadrante superior derecho."
  }
];

/* --- GAME STATE --- */
var user=null;
var G={room:0,time:0,intv:null,hints:3,done:false};
var seqSel=null;
var matchSel=null;
var triviaCur=0;
var triviaCode="";

/* ============================================================
   AUTH
   ============================================================ */
function goAuth(){
  ea();sndClick();
  var u=document.getElementById('au').value.trim();
  var p=document.getElementById('ap').value.trim();
  var r=document.getElementById('ar').value;
  if(!u){alert('Escribe tu nombre');return}
  if(!p){alert('Escribe una contrasena');return}
  var us=gU();
  if(us[u]&&us[u].p!==p){alert('Contrasena incorrecta');return}
  if(!us[u]){us[u]={p:p,r:r,c:new Date().toISOString()};sU(us)}
  user={name:u,role:us[u].r};
  var db=gD();db.s.push({u:u,t:new Date().toISOString(),a:'in'});sD(db);
  hideAll();
  if(r==='teacher'){showAnl()}else{startGame()}
}

function hideAll(){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++)ss[i].classList.remove('active');
}

/* ============================================================
   GAME FLOW
   ============================================================ */
function startGame(){
  G={room:0,time:0,intv:null,hints:3,done:false};
  hideAll();
  document.getElementById('scr-game').classList.add('active');
  startTimer();
  loadRoom(0);
}

function startTimer(){
  clearInterval(G.intv);
  G.intv=setInterval(function(){
    if(G.done)return;
    G.time++;
    var m=Math.floor(G.time/60),s=G.time%60;
    document.getElementById('g-timer').textContent=pad(m)+':'+pad(s);
  },1000);
}
function pad(n){return n<10?'0'+n:''+n}

/* ============================================================
   LOAD ROOM
   ============================================================ */
function loadRoom(idx){
  G.room=idx;
  G.hints=3;
  seqSel=null;
  matchSel=null;
  triviaCur=0;
  triviaCode='';

  var room=ROOMS[idx];
  document.getElementById('g-name').textContent=room.name;
  document.getElementById('g-hints').textContent=G.hints+' pistas';

  var w=document.getElementById('g-content');
  var h='<div class="anim">';
  h+='<div class="room-title">'+room.name+'</div>';
  h+='<div class="room-desc">'+room.desc+'</div>';
  h+='<div class="puzzle-card" id="pz"></div>';
  h+='<div id="hint-zone"></div>';
  h+='<div id="fact-zone"></div>';
  h+='<div class="btn-row"><button class="btn btn-hint" onclick="useHint()">Pista</button></div>';
  h+='</div>';
  w.innerHTML=h;

  var pz=document.getElementById('pz');
  if(room.type==='order')buildOrder(room,pz);
  else if(room.type==='match')buildMatch(room,pz);
  else if(room.type==='trivia')buildTrivia(room,pz);
  else if(room.type==='code')buildCode(room,pz);
}

/* ============================================================
   ORDER PUZZLE (tap two to swap)
   ============================================================ */
function buildOrder(room,pz){
  var items=room.items.slice();
  var h='<h3>Ordena de primero a ultimo</h3>';
  h+='<p style="font-size:14px;color:#999;text-align:center;margin-bottom:14px">Toca un item, luego toca otro para intercambiarlos</p>';
  h+='<div class="seq-list" id="seqList">';
  for(var i=0;i<items.length;i++){
    h+='<div class="seq-item" data-i="'+i+'" onclick="seqTap(this)"><span class="snum">'+(i+1)+'</span><span>'+items[i]+'</span></div>';
  }
  h+='</div>';
  h+='<div class="btn-row"><button class="btn btn-go" onclick="checkOrder()">Verificar</button></div>';
  pz.innerHTML=h;
}

function seqTap(el){
  sndClick();
  var list=document.getElementById('seqList');
  var all=list.querySelectorAll('.seq-item');

  if(!seqSel){
    seqSel=el;
    el.classList.add('sel');
  }else if(seqSel===el){
    el.classList.remove('sel');
    seqSel=null;
  }else{
    var a=seqSel,b=el;
    var ai=parseInt(a.dataset.i),bi=parseInt(b.dataset.i);
    var list2=document.getElementById('seqList');
    var items2=list2.querySelectorAll('.seq-item');
    var orderArr=[];
    for(var i=0;i<items2.length;i++){
      orderArr.push({html:items2[i].innerHTML,idx:parseInt(items2[i].dataset.i)});
    }
    var tmp=orderArr[ai];orderArr[ai]=orderArr[bi];orderArr[bi]=tmp;
    for(var i=0;i<orderArr.length;i++){
      items2[i].innerHTML=orderArr[i].html;
      items2[i].dataset.i=orderArr[i].idx;
    }
    seqSel.classList.remove('sel');
    seqSel=null;
  }
}

function checkOrder(){
  var list=document.getElementById('seqList');
  var items=list.querySelectorAll('.seq-item');
  var room=ROOMS[G.room];
  var correct=true;
  for(var i=0;i<items.length;i++){
    var idx=parseInt(items[i].dataset.i);
    if(idx!==i)correct=false;
  }
  if(correct){
    sndOk();
    for(var i=0;i<items.length;i++)items[i].classList.add('ok');
    setTimeout(function(){
      var fz=document.getElementById('fact-zone');
      fz.innerHTML='<div class="fact-box">'+room.fact+'</div>';
      setTimeout(function(){goNext()},1500);
    },400);
  }else{
    sndNo();
    for(var i=0;i<items.length;i++){
      var idx=parseInt(items[i].dataset.i);
      if(idx!==i)items[i].classList.add('err');
    }
    setTimeout(function(){
      var items2=list.querySelectorAll('.seq-item');
      for(var i=0;i<items2.length;i++)items2[i].classList.remove('err');
    },600);
  }
}

/* ============================================================
   MATCH PUZZLE
   ============================================================ */
function buildMatch(room,pz){
  var rightIndices=room.pairs.slice();
  var shuffled=[];
  var used={};
  for(var i=0;i<rightIndices.length;i++){
    var ri=rightIndices[i];
    shuffled.push(ri);
  }
  // Fisher-Yates shuffle
  for(var i=shuffled.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=t;
  }

  var h='<h3>Empareja celula con funcion</h3>';
  h+='<div class="match-grid">';
  h+='<div class="match-col"><h4>Celula</h4>';
  for(var i=0;i<room.left.length;i++){
    h+='<div class="match-item" data-side="L" data-i="'+i+'" onclick="mtap(this)">'+room.left[i]+'</div>';
  }
  h+='</div><div class="match-col"><h4>Funcion</h4>';
  for(var i=0;i<shuffled.length;i++){
    h+='<div class="match-item" data-side="R" data-i="'+shuffled[i]+'" onclick="mtap(this)">'+room.right[shuffled[i]]+'</div>';
  }
  h+='</div></div>';
  h+='<div class="btn-row"><button class="btn btn-go" onclick="checkMatch()">Verificar</button></div>';
  pz.innerHTML=h;
  matchSel=null;
}

function mtap(el){
  sndClick();
  if(el.classList.contains('matched'))return;
  var side=el.dataset.side;
  var idx=parseInt(el.dataset.i);

  if(!matchSel){
    matchSel={el:el,side:side,idx:idx};
    el.classList.add('sel');
  }else{
    var prev=matchSel;
    if(prev.side===side){
      prev.el.classList.remove('sel');
      matchSel={el:el,side:side,idx:idx};
      el.classList.add('sel');
      return;
    }
    // Check if indices match (they should be the same original index)
    if(prev.idx===idx){
      prev.el.classList.remove('sel');
      prev.el.classList.add('matched');
      el.classList.add('matched');
      sndOk();
    }else{
      prev.el.classList.remove('sel');
      prev.el.classList.add('wrong');
      el.classList.add('wrong');
      sndNo();
      setTimeout(function(){
        var items=document.querySelectorAll('.match-item.wrong');
        for(var i=0;i<items.length;i++)items[i].classList.remove('wrong');
      },500);
    }
    matchSel=null;
  }
}

function checkMatch(){
  var matched=document.querySelectorAll('.match-item.matched');
  var room=ROOMS[G.room];
  if(matched.length===room.left.length*2){
    sndOk();
    setTimeout(function(){
      var fz=document.getElementById('fact-zone');
      fz.innerHTML='<div class="fact-box">'+room.fact+'</div>';
      setTimeout(function(){goNext()},1500);
    },400);
  }
}

/* ============================================================
   TRIVIA PUZZLE
   ============================================================ */
function buildTrivia(room,pz){
  triviaCur=0;
  triviaCode='';
  renderTrivia(room);
}

function renderTrivia(room){
  var pz=document.getElementById('pz');
  if(triviaCur>=room.qs.length){
    var h='<h3>Codigo obtenido</h3>';
    h+='<div style="text-align:center;font-size:36px;font-weight:700;color:#A3D9A5;letter-spacing:12px;margin:20px 0">'+triviaCode+'</div>';
    h+='<p style="text-align:center;color:#888;font-size:14px">Usa este codigo en la Sala 5</p>';
    h+='<div class="btn-row"><button class="btn btn-go" onclick="goNext()">Continuar</button></div>';
    pz.innerHTML=h;
    return;
  }

  var q=room.qs[triviaCur];
  var h='<h3>Pregunta '+((triviaCur+1))+' de '+room.qs.length+'</h3>';
  h+='<div class="trivia-q">'+q.q+'</div>';
  h+='<div class="trivia-opts">';
  for(var i=0;i<q.opts.length;i++){
    h+='<div class="trivia-opt" onclick="tAns('+i+')">'+q.opts[i]+'</div>';
  }
  h+='</div>';
  pz.innerHTML=h;
}

function tAns(i){
  var room=ROOMS[G.room];
  var q=room.qs[triviaCur];
  var opts=document.querySelectorAll('.trivia-opt');
  for(var j=0;j<opts.length;j++)opts[j].style.pointerEvents='none';

  if(i===q.ans){
    opts[i].classList.add('ok');
    triviaCode+=q.dig;
    sndOk();
  }else{
    opts[i].classList.add('no');
    opts[q.ans].classList.add('ok');
    sndNo();
  }

  triviaCur++;
  setTimeout(function(){renderTrivia(room)},1200);
}

/* ============================================================
   CODE PUZZLE
   ============================================================ */
function buildCode(room,pz){
  var h='<h3>Introduce el codigo de 4 digitos</h3>';
  h+='<p style="text-align:center;color:#888;font-size:14px;margin-bottom:16px">Usa los digitos que obtuviste en la Sala 4</p>';
  h+='<div class="code-row" id="codeRow">';
  h+='<input type="tel" maxlength="1" inputmode="numeric" oninput="cNext(this)" onkeydown="cBack(event,this)" autofocus>';
  h+='<input type="tel" maxlength="1" inputmode="numeric" oninput="cNext(this)" onkeydown="cBack(event,this)">';
  h+='<input type="tel" maxlength="1" inputmode="numeric" oninput="cNext(this)" onkeydown="cBack(event,this)">';
  h+='<input type="tel" maxlength="1" inputmode="numeric" oninput="cNext(this)" onkeydown="cBack(event,this)">';
  h+='</div>';
  h+='<div class="btn-row"><button class="btn btn-go" onclick="checkCode()">Abrir salida</button></div>';
  pz.innerHTML=h;
  setTimeout(function(){var inp=document.querySelectorAll('#codeRow input');if(inp[0])inp[0].focus()},300);
}

function cNext(el){
  if(el.value.length>0){
    var all=document.querySelectorAll('#codeRow input');
    for(var i=0;i<all.length;i++){if(all[i]===el&&i<all.length-1){all[i+1].focus();return}}
  }
}
function cBack(e,el){
  if(e.key==='Backspace'&&el.value===''){
    var all=document.querySelectorAll('#codeRow input');
    for(var i=0;i<all.length;i++){if(all[i]===el&&i>0){all[i-1].focus();return}}
  }
}

function checkCode(){
  var all=document.querySelectorAll('#codeRow input');
  var code='';
  for(var i=0;i<all.length;i++)code+=all[i].value;
  var room=ROOMS[G.room];

  if(code===room.code){
    sndWin();
    G.done=true;
    clearInterval(G.intv);
    for(var i=0;i<all.length;i++){all[i].style.borderColor='#A3D9A5';all[i].style.background='rgba(163,217,165,0.1)'}
    setTimeout(function(){showDone()},1200);
  }else{
    sndNo();
    for(var i=0;i<all.length;i++){
      all[i].style.borderColor='#E64A4A';
      all[i].classList.add('shk');
    }
    setTimeout(function(){
      var all2=document.querySelectorAll('#codeRow input');
      for(var i=0;i<all2.length;i++){all2[i].style.borderColor='#EDEDED';all2[i].classList.remove('shk')}
    },600);
  }
}

/* ============================================================
   HINTS
   ============================================================ */
function useHint(){
  if(G.hints<=0)return;
  sndClick();
  G.hints--;
  document.getElementById('g-hints').textContent=G.hints+' pistas';
  var room=ROOMS[G.room];
  var hi=3-G.hints-1;
  var hz=document.getElementById('hint-zone');
  if(hi<room.hints.length){
    hz.innerHTML='<div class="hint-box anim"><b>Pista '+(hi+1)+':</b> '+room.hints[hi]+'</div>';
  }
}

/* ============================================================
   NEXT ROOM
   ============================================================ */
function goNext(){
  sndOk();
  if(G.room<ROOMS.length-1){
    loadRoom(G.room+1);
  }
}

/* ============================================================
   COMPLETE
   ============================================================ */
function showDone(){
  hideAll();
  document.getElementById('scr-done').classList.add('active');

  var m=Math.floor(G.time/60),s=G.time%60;
  var ts=pad(m)+':'+pad(s);
  var score=Math.max(0,500-G.time*2-G.hints*30);

  var bx=document.getElementById('done-box');
  bx.innerHTML='<h1>Escapaste!</h1>';
  bx.innerHTML+='<div class="d-time">Tiempo: '+ts+'</div>';
  bx.innerHTML+='<div class="d-score">Puntuacion: '+score+'</div>';
  bx.innerHTML+='<div class="stats-grid">';
  bx.innerHTML+='<div class="stat-box"><div class="sv">'+ROOMS.length+'</div><div class="sl">Salas</div></div>';
  bx.innerHTML+='<div class="stat-box"><div class="sv">'+G.hints+'</div><div class="sl">Pistas restantes</div></div>';
  bx.innerHTML+='<div class="stat-box"><div class="sv">'+ts+'</div><div class="sl">Tiempo</div></div>';
  bx.innerHTML+='<div class="stat-box"><div class="sv">'+score+'</div><div class="sl">Puntos</div></div>';
  bx.innerHTML+='</div>';

  bx.innerHTML+='<div class="learn-box"><b>Aprendiste que:</b><br>';
  for(var i=0;i<ROOMS.length;i++)bx.innerHTML+=ROOMS[i].fact+'<br>';
  bx.innerHTML+='</div>';

  bx.innerHTML+='<div class="btn-row"><button class="btn btn-go" onclick="goMenu()">Menu</button><button class="btn btn-out" onclick="startGame()">Jugar de nuevo</button></div>';

  // Save data
  var us=gU();
  if(us[user.name]){
    us[user.name].sc=score;us[user.name].tm=G.time;us[user.name].ht=G.hints;
    us[user.name].last=new Date().toISOString();
    sU(us);
  }
  var db=gD();
  db.a[user.name]={sc:score,tm:G.time,ht:G.hints,ok:true,date:new Date().toISOString()};
  db.s.push({u:user.name,t:new Date().toISOString(),a:'done',sc:score,tm:G.time});
  sD(db);
}

/* ============================================================
   MENU
   ============================================================ */
function goMenu(){
  clearInterval(G.intv);
  hideAll();
  document.getElementById('scr-auth').classList.add('active');
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function showAnl(){
  hideAll();
  document.getElementById('scr-anl').classList.add('active');
  var db=gD(),us=gU(),an=db.a||{};
  var ks=Object.keys(an);
  var tp=Object.keys(us).filter(function(k){return us[k].r==='student'}).length;

  var h='<h2>Panel Docente</h2>';
  h+='<div class="anl-stats">';
  h+='<div class="anl-sc"><div class="v">'+tp+'</div><div class="l">Estudiantes</div></div>';
  h+='<div class="anl-sc"><div class="v">'+ks.length+'</div><div class="l">Completaron</div></div>';
  h+='</div>';

  if(ks.length===0){
    h+='<p style="color:#999;text-align:center;padding:40px">Sin datos aun. Los estudiantes deben jugar primero.</p>';
  }else{
    h+='<table><tr><th>Estudiante</th><th>Puntos</th><th>Tiempo</th><th>Pistas</th><th>Fecha</th></tr>';
    ks.forEach(function(k){
      var d=an[k];
      var tm=d.tm?Math.floor(d.tm/60)+'m '+(d.tm%60)+'s':'-';
      h+='<tr><td><b>'+k+'</b></td><td>'+(d.sc||0)+'</td><td>'+tm+'</td><td>'+d.ht+'</td><td>'+new Date(d.date).toLocaleDateString('es')+'</td></tr>';
    });
    h+='</table>';
  }

  h+='<div class="btn-row" style="margin-top:16px">';
  h+='<button class="btn btn-go" onclick="expJSON()">Exportar JSON</button>';
  h+='<button class="btn btn-out" onclick="goMenu()">Volver</button>';
  h+='</div>';

  document.getElementById('anl-box').innerHTML=h;
}

function expJSON(){
  var db=gD(),us=gU();
  var d={date:new Date().toISOString(),users:us,analytics:db.a,sessions:db.s};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b);
  var a=document.createElement('a');
  a.href=u;a.download='escape_room_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(u);
}
